name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with: { name: web, path: dist }

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk ChatArchive-android.apk
      - uses: actions/upload-artifact@v5
        with: { name: android, path: ChatArchive-android.apk }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Build installers
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee builder.log || {
            # Surface the tail of the log as annotations so it is visible without log access.
            grep -iE "⨯|error|cannot|failed|exit code" builder.log | tail -n 9 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
      - name: Collect installers
        shell: bash
        run: |
          mkdir out
          cp release/ChatArchive-windows-setup.exe release/ChatArchive-windows-portable.exe out/
      - uses: actions/upload-artifact@v5
        with: { name: windows, path: out/* }

  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R ios-build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ChatArchive-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        with: { name: ios, path: ChatArchive-ios-unsigned.ipa }

  release:
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: artifacts }
      - name: Package web bundle for over-the-air updates
        run: |
          (cd artifacts/web && zip -qr ../../web-bundle.zip .)
          cp artifacts/web/version.json version.json
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --target "$GITHUB_SHA" --title "Архив чатов (сборка ${GITHUB_RUN_NUMBER})" --notes "
          - **Windows**: ChatArchive-windows-setup.exe (установщик) или ChatArchive-windows-portable.exe (без установки).
          - **Android**: ChatArchive-android.apk. Откройте файл на телефоне и разрешите установку из этого источника.
          - **iPhone**: ChatArchive-ios-unsigned.ipa. Устанавливается через Sideloadly или AltStore с вашим Apple ID (см. README).

          Установленные приложения обновляются сами: web-bundle.zip и version.json скачивать не нужно.
          " \
            artifacts/android/*.apk artifacts/windows/*.exe artifacts/ios/*.ipa web-bundle.zip version.json
